[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concurrent-web-fetcher"
version = "0.1.0"
description = "An asynchronous concurrent web page fetcher"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "beautifulsoup4"
]

[project.scripts]
web-fetcher = "web_fetcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]